##############################
#        SERVER
##############################
spring.application.name=UstaZoneBackend
server.port=8080
server.url=http://localhost:${server.port}

##############################
#        DATABASE
##############################
spring.datasource.url=jdbc:postgresql://localhost:8081/ustazone_db
spring.datasource.username=ustazone_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

########################
#        JWT
########################
jwt.secret.key=${JWT_SECRET}

##############################
#        EMAIL
##############################
spring.mail.host=smtp.mail.ru
spring.mail.port=465
spring.mail.username=ustazone@mail.ru
spring.mail.password=${MAIL_TOKEN}
spring.mail.protocol=smtps

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=50000
spring.mail.properties.mail.smtp.timeout=50000
spring.mail.properties.mail.smtp.writetimeout=50000

##############################
#        ATTACH
##############################
attache.folder=attaches

########################
#        FlyWay
########################
spring.flyway.enabled=false
spring.flyway.baselineOnMigrate=true
spring.flyway.baselineVersion=0
